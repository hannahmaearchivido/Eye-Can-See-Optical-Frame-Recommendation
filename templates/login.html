<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <meta name="description" content="">
    <meta name="author" content="">

    <title>Eye Can See Optical - Login</title>

    <!-- Custom fonts for this templates-->
    <link href="{{ url_for('static', filename='vendor/fontawesome-free/css/all.min.css') }}" rel="stylesheet">
    <link rel="icon" href="{{ url_for('static', filename='img/icon logo.png') }}" type="image/png">
    <link
        href="https://fonts.googleapis.com/css?family=Nunito:200,200i,300,300i,400,400i,600,600i,700,700i,800,800i,900,900i"
        rel="stylesheet">

    <!-- Custom styles for this templates-->
    <link href="{{ url_for('static', filename='css/sb-admin-2.css') }}" rel="stylesheet">

    <style>
    .flash-messages {
      margin-bottom: 15px;
    }
    .alert {
      padding: 10px;
      border-radius: 5px;
      margin-bottom: 10px;
    }
    .alert-error { background: #f8d7da; color: #721c24; }
    .alert-success { background: #d4edda; color: #155724; }

        /* === LOGO SECTION === */
    .logo-section {
      text-align: center;
    }

    .responsive-logo {
      max-width: 300px;
      height: auto;
      transition: transform 0.3s ease;
    }

    .logo-text {
      font-size: 1.2rem;
      margin-top: 10px;
    }

    /* Hover effect (optional aesthetic) */
    .responsive-logo:hover {
      transform: scale(1.05);
    }

    /* === RESPONSIVE BREAKPOINTS === */

    /* Medium screens (≤ 992px) */
    @media (max-width: 992px) {
      .responsive-logo {
        max-width: 250px;
      }
      .logo-text {
        font-size: 1.1rem;
      }
    }

    /* Tablets (≤ 768px) */
    @media (max-width: 768px) {
      .responsive-logo {
        max-width: 230px;
      }
      .logo-text {
        font-size: 0.95rem;
      }
    }

    /* Small screens (≤ 576px) */
    @media (max-width: 576px) {
      .logo-section {
        margin-top: 3rem;
      }

      .responsive-logo {
        max-width: 210px;
      }
      .logo-text {
        font-size: 0.9rem;
      }
    }

  </style>

</head>

<body class="bg-gradient-primary1">

    <div class="container">

        <!-- Outer Row -->
        <div class="row justify-content-center">

            <div class="col-xl-10 col-lg-12 col-md-9">

                <div class="card o-hidden border-0 shadow-lg my-5">
                    <div class="card-body p-0">
                        <!-- Nested Row within Card Body -->
                        <div class="row">
                            <div class="col-lg-5 d-flex flex-column justify-content-center align-items-center text-center logo-section mb-lg-0">
                              <img src="static/img/logo.png" alt="Register Image" class="img-fluid responsive-logo">
                              <h6 class="logo-text mt-3"><strong>Eye Can See Optical</strong></h6>
                            </div>

                            <div class="col-lg-7">
                                <div class="p-5">
                                    <div class="text-center">
                                        <h1 class="h4 text-gray-900 mb-4"><strong>Welcome Back!</strong></h1>
                                    </div>
                                    <!-- ✅ Flash Messages -->
                                    {% with messages = get_flashed_messages(with_categories=true) %}
                                      {% if messages %}
                                        <div class="flash-messages">
                                          {% for category, message in messages %}
                                            <div class="alert alert-{{ category }}">
                                              {{ message }}
                                            </div>
                                          {% endfor %}
                                        </div>
                                      {% endif %}
                                    {% endwith %}
                                    <form class="user" method="POST" action="{{ url_for('login') }}">
                                        <div class="form-group" id="role-group">
                                            <label for="username">Role</label>
                                            <select class="form-control1 " id="user_type" name="role" required>
                                                <option value="">-- Select Role --</option>
                                                <option value="admin">Admin</option>
                                                <option value="patient">Patient</option>
                                            </select>
                                        </div>
                                        <div class="form-group">
                                            <label for="username">Username/Email Address</label>
                                            <input type="text" class="form-control1 " id="username" name="username" placeholder="Enter username or email address">
                                        </div>
                                        <div class="form-group">
                                            <label for="password">Password</label>
                                            <input type="password" name="password" id="password" class="form-control1" placeholder="Enter your password" required>
                                        </div>
                                        <button type="submit" class="btn btn-primary btn-user btn-block">
                                            Login
                                        </button>
                                    </form>
                                    <hr>
                                    <div class="text-center">
                                        <a class="small" href="{{ url_for('forgot_password') }}" style=" color: #9C2627;">Forgot Password?</a>
                                    </div>
                                    <div class="text-center">
                                        <a class="small" href="{{ url_for('register') }}" style=" color: #9C2627;">Create an Account!</a>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

            </div>

        </div>

    </div>

    <!-- Bootstrap core JavaScript-->
    <script src="vendor/jquery/jquery.min.js"></script>
    <script src="vendor/bootstrap/js/bootstrap.bundle.min.js"></script>

    <!-- Core plugin JavaScript-->
    <script src="vendor/jquery-easing/jquery.easing.min.js"></script>

    <!-- Custom scripts for all pages-->
    <script src="js/sb-admin-2.min.js"></script>

</body>

</html>
